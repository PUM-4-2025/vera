name: TypeScript Client CI

on:
  push:
    branches: [main, testing, dev]
    paths:
      - "client/**"
      - ".github/workflows/format_check_client.yml"
  pull_request:
    branches: [main, testing, dev]
    paths:
      - "client/**"
      - ".github/workflows/format_check_client.yml"

jobs:
  lint-and-format-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v3

      - name: Set up node
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run eslint (might want to use warnings=0 in the future)
        run: npm run lint

      - name: Run formatting checks
        run: npm run format:check

  test-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v3

      - name: Set up node
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v3

      - name: Set up node
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
