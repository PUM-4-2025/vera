name: C++ Server CI

on:
  push:
    branches: [main, testing, dev]
    paths:
      - "server/**"
      - ".github/workflows/format_check_server.yml"
  pull_request:
    branches: [main, testing, dev]
    paths:
      - "server/**"
      - ".github/workflows/format_check_server.yml"

jobs:
  lint-and-format-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy clang-format cmake libgtest-dev

          git submodule init
          git submodule update --remote

      - name: Run clang-format (will probably change this script)
        run: |
          find . -type f -regex ".*\.\(c\|h\)\(pp\|xx\|\+\+\|c\|\)$" -not -path "*/extern/*" -not -path "*/static/*" -not -path "*/build/*" -exec clang-format --style=file:.clang-format {} \;


      - name: Configure cmaake
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON ..

      - name: Run clang-tidy
        run: |
          find . -type f -regex ".*\.\(c\|h\)\(pp\|xx\|\+\+\|c\|\)$" -not -path "*/extern/*" -not -path "*/static/*" -not -path "*/build/*" -exec clang-tidy -p=build --config-file=.clang-tidy {} \;

  build-and-test-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libgtest-dev

          git submodule init
          git submodule update --remote

      - name: Configure cmake
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON ..

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Test
        run: |
          cd build
          ctest --verbose
