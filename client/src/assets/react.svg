<svg width="500" height="150" viewBox="0 0 500 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: dark) {
      .text { fill: white; }
    }
    @media (prefers-color-scheme: light) {
      .text { fill: black; }
    }
  </style>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="veraGradient" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" style="stop-color: #FFD700; stop-opacity: 1" />
      <stop offset="100%" style="stop-color: #0057B8; stop-opacity: 1" />
    </linearGradient>
  </defs>

  <!-- Eye Logo -->
  <circle cx="60" cy="75" r="50" fill="url(#veraGradient)" stroke="black" stroke-width="5"/>
  <circle cx="60" cy="75" r="20" fill="black" />

  <!-- Text -->
  <text x="130" y="90" font-size="80" font-weight="bold" font-family="Arial, sans-serif" class="text">
    VERA
  </text>

  <!-- Arrow -->
  <polygon points="420,60 470,75 420,90" fill="url(#veraGradient)" />
</svg>