<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1000" height="250" viewBox="0 0 1000 250" xmlns="http://www.w3.org/2000/svg" fill="none">
    <!-- Eye and gradient matching original logo more closely -->
    <defs>
        <linearGradient id="eyeGradient" x1="0%" y1="50%" x2="100%" y2="50%">
            <stop offset="0%" stop-color="#0057B7"/>
            <stop offset="100%" stop-color="#FFD700"/>
        </linearGradient>
    </defs>
    <circle cx="85" cy="125" r="75" fill="url(#eyeGradient)"/>
    <circle cx="85" cy="125" r="20" fill="#000"/>
    <path d="M30 125 Q85 35 140 125 Q85 215 30 125 Z" stroke="#000" stroke-width="10" fill="none"/>
    
    <!-- Text "VERA" styled closer to original -->
    <text x="170" y="175" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#222">VERA</text>
    
    <!-- Play button with refined gradient -->
    <defs>
        <linearGradient id="arrowGradient" x1="0%" y1="50%" x2="100%" y2="50%">
            <stop offset="0%" stop-color="#FFD700"/>
            <stop offset="100%" stop-color="#0057B7"/>
        </linearGradient>
    </defs>
    <polygon points="950,125 890,85 890,165" fill="url(#arrowGradient)"/>
</svg>